services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jotly}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jotly}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-168}
      AI_ASSISTANT_PROVIDER: ${AI_ASSISTANT_PROVIDER:-heuristic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      AI_ASSISTANT_TIMEOUT_MS: ${AI_ASSISTANT_TIMEOUT_MS:-10000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://jotly.godwinavodagbe.com}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://postgres:postgres@postgres:5432/jotly}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_CALENDAR_ENCRYPTION_KEY: ${GOOGLE_CALENDAR_ENCRYPTION_KEY:-}
      # MCP server for LLM clients (ChatGPT, Claude); see README "MCP server".
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_BASE_URL: ${MCP_BASE_URL:-}
      MCP_ALLOWED_EMAILS: ${MCP_ALLOWED_EMAILS:-}
      MCP_JOTLY_USER_EMAIL: ${MCP_JOTLY_USER_EMAIL:-}
      MCP_ALLOWED_REDIRECT_URIS: ${MCP_ALLOWED_REDIRECT_URIS:-}
      MCP_CIMD_ALLOWED_HOSTS: ${MCP_CIMD_ALLOWED_HOSTS:-claude.ai,chatgpt.com}
      MCP_GOOGLE_CLIENT_ID: ${MCP_GOOGLE_CLIENT_ID:-}
      MCP_GOOGLE_CLIENT_SECRET: ${MCP_GOOGLE_CLIENT_SECRET:-}
      MCP_RATE_LIMIT_PER_SECOND: ${MCP_RATE_LIMIT_PER_SECOND:-3}
      MCP_RATE_LIMIT_BURST: ${MCP_RATE_LIMIT_BURST:-30}
      MCP_DAILY_WRITE_LIMIT: ${MCP_DAILY_WRITE_LIMIT:-100}
    # Loopback only: host nginx routes /mcp, /oauth/ and OAuth discovery here.
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3101}:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        BACKEND_API_BASE_URL: ${FRONTEND_BACKEND_API_BASE_URL:-http://backend:3001}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://jotly.godwinavodagbe.com/backend-api}
    restart: unless-stopped
    environment:
      BACKEND_API_BASE_URL: ${FRONTEND_BACKEND_API_BASE_URL:-http://backend:3001}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://jotly.godwinavodagbe.com/backend-api}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3100}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
